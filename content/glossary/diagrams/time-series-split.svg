<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 188" role="img">
<title>Time-based split: training window grows, test is always later</title>
<defs><marker id="time-series-split-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="f-ink s-none"/></marker></defs>
<text x="8" y="27" class="t-small">Split 1</text>
<rect x="56" y="14" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="98" y="14" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="140" y="14" width="42" height="18" class="f-muted s-ink s-thin"/>
<rect x="182" y="14" width="42" height="18" class="s-line s-thin s-dash"/>
<rect x="224" y="14" width="42" height="18" class="s-line s-thin s-dash"/>
<rect x="266" y="14" width="42" height="18" class="s-line s-thin s-dash"/>
<text x="8" y="53" class="t-small">Split 2</text>
<rect x="56" y="40" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="98" y="40" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="140" y="40" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="182" y="40" width="42" height="18" class="f-muted s-ink s-thin"/>
<rect x="224" y="40" width="42" height="18" class="s-line s-thin s-dash"/>
<rect x="266" y="40" width="42" height="18" class="s-line s-thin s-dash"/>
<text x="8" y="79" class="t-small">Split 3</text>
<rect x="56" y="66" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="98" y="66" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="140" y="66" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="182" y="66" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="224" y="66" width="42" height="18" class="f-muted s-ink s-thin"/>
<rect x="266" y="66" width="42" height="18" class="s-line s-thin s-dash"/>
<text x="8" y="105" class="t-small">Split 4</text>
<rect x="56" y="92" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="98" y="92" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="140" y="92" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="182" y="92" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="224" y="92" width="42" height="18" class="f-sheet s-line s-thin"/>
<rect x="266" y="92" width="42" height="18" class="f-muted s-ink s-thin"/>
<line x1="56" y1="124" x2="312" y2="124" class="s-ink s-thin" marker-end="url(#time-series-split-arrow)"/>
<text x="312" y="138" text-anchor="end" class="t-small">time</text>
<rect x="56" y="148" width="14" height="10" class="f-sheet s-line s-thin"/>
<text x="75" y="157" class="t-small">train</text>
<rect x="118" y="148" width="14" height="10" class="f-muted s-ink s-thin"/>
<text x="137" y="157" class="t-small">test</text>
<rect x="174" y="148" width="14" height="10" class="s-line s-thin s-dash"/>
<text x="193" y="157" class="t-small">not used yet</text>
<text x="160" y="180" text-anchor="middle" class="t-small">Always train on the past, test on what comes next</text>
</svg>
