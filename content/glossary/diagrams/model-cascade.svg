<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 176" role="img">
<title>A model cascade tries a cheap model first and escalates to a large one only when unsure</title>
<defs><marker id="model-cascade-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink s-none"/></marker></defs>
<rect x="4" y="30" width="50" height="30" rx="5" class="f-sheet s-muted"/>
<text x="29" y="49" text-anchor="middle" class="t-small">input</text>
<path d="M54,45 L72,45" class="s-ink" marker-end="url(#model-cascade-ink)"/>
<rect x="74" y="30" width="76" height="30" rx="5" class="f-sheet s-muted"/>
<text x="112" y="43" text-anchor="middle" class="t-small">small model</text>
<text x="112" y="55" text-anchor="middle" class="t-small">cheap</text>
<polygon points="162,45 196,25 230,45 196,65" class="f-paper s-ink"/>
<text x="196" y="49" text-anchor="middle" class="t-small">confident?</text>
<path d="M150,45 L160,45" class="s-ink" marker-end="url(#model-cascade-ink)"/>
<path d="M230,45 L258,45" class="s-ink" marker-end="url(#model-cascade-ink)"/>
<text x="244" y="39" text-anchor="middle" class="t-small t-bold">yes</text>
<rect x="260" y="30" width="56" height="30" rx="5" class="f-right s-right"/>
<text x="288" y="49" text-anchor="middle" class="t-small">answer</text>
<path d="M196,65 L196,108" class="s-ink" marker-end="url(#model-cascade-ink)"/>
<text x="202" y="86" class="t-small t-bold">no</text>
<rect x="156" y="110" width="80" height="30" rx="5" class="f-sheet s-ink"/>
<text x="196" y="123" text-anchor="middle" class="t-small">large model</text>
<text x="196" y="135" text-anchor="middle" class="t-small">costly</text>
<path d="M236,125 L288,125 L288,62" class="s-ink" marker-end="url(#model-cascade-ink)"/>
<text x="160" y="166" text-anchor="middle" class="t-small t-muted">Most inputs stop at the small model.</text>
</svg>
