<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" role="img">
<title>Point-in-time join: use only data known at prediction time</title>
<defs><marker id="point-in-time-correctness-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="f-ink s-none"/></marker></defs>
<text x="170" y="16" text-anchor="middle" class="t-small t-bold">prediction time</text>
<line x1="170" y1="22" x2="170" y2="128" class="s-ink s-dash"/>
<rect x="20" y="36" width="140" height="30" rx="4" class="f-right s-right"/>
<text x="90" y="55" text-anchor="middle" class="t-small">known by then: use</text>
<rect x="180" y="78" width="125" height="30" rx="4" class="f-wrong s-wrong"/>
<text x="242" y="97" text-anchor="middle" class="t-small">arrived later: leak</text>
<line x1="14" y1="128" x2="308" y2="128" class="s-ink s-thin" marker-end="url(#point-in-time-correctness-arrow)"/>
<text x="308" y="142" text-anchor="end" class="t-small">time</text>
<circle cx="60" cy="128" r="3" class="f-ink s-none"/>
<circle cx="120" cy="128" r="3" class="f-ink s-none"/>
<circle cx="220" cy="128" r="3" class="f-ink s-none"/>
<circle cx="270" cy="128" r="3" class="f-ink s-none"/>
<text x="90" y="142" text-anchor="middle" class="t-small t-muted">feature updates</text>
<text x="160" y="166" text-anchor="middle" class="t-small">Join each feature as it was at that moment,</text>
<text x="160" y="179" text-anchor="middle" class="t-small">not as it looks today</text>
</svg>
