<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 182" role="img">
<title>A small draft model guesses several tokens and the large model checks them in one pass</title>
<defs><marker id="speculative-decoding-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-muted s-none"/></marker></defs>
<text x="8" y="18" class="t-small t-muted">context: The cat</text>
<text x="6" y="50" class="t-small t-bold">draft</text>
<text x="6" y="130" class="t-small t-bold">output</text>
<rect x="70" y="34" width="48" height="24" rx="5" class="f-right s-right"/>
<text x="94" y="50" text-anchor="middle" class="t-small">sat</text>
<rect x="124" y="34" width="48" height="24" rx="5" class="f-right s-right"/>
<text x="148" y="50" text-anchor="middle" class="t-small">on</text>
<rect x="178" y="34" width="48" height="24" rx="5" class="f-wrong s-wrong"/>
<text x="202" y="50" text-anchor="middle" class="t-small">a</text>
<rect x="232" y="34" width="48" height="24" rx="5" class="f-paper s-line s-dash"/>
<text x="256" y="50" text-anchor="middle" class="t-small t-muted">mat</text>
<text x="256" y="72" text-anchor="middle" class="t-small t-muted">dropped</text>
<text x="202" y="72" text-anchor="middle" class="t-small">rejected</text>
<path d="M22,58 L22,114" class="s-muted" marker-end="url(#speculative-decoding-muted)"/>
<rect x="70" y="114" width="48" height="24" rx="5" class="f-sheet s-muted"/>
<text x="94" y="130" text-anchor="middle" class="t-small">sat</text>
<rect x="124" y="114" width="48" height="24" rx="5" class="f-sheet s-muted"/>
<text x="148" y="130" text-anchor="middle" class="t-small">on</text>
<rect x="178" y="114" width="48" height="24" rx="5" class="f-paper s-ink s-thick"/>
<text x="202" y="130" text-anchor="middle" class="t-small t-bold">the</text>
<text x="232" y="124" class="t-small t-muted">large model's</text>
<text x="232" y="136" class="t-small t-muted">own token</text>
<text x="36" y="96" class="t-small t-muted">large model checks all 4 in one pass</text>
<text x="160" y="168" text-anchor="middle" class="t-small t-muted">3 tokens from one large-model pass.</text>
</svg>
