<path d="M10,40 V112 M10,40 H82 M22,40 V112 M10,52 H82 M34,40 V112 M10,64 H82 M46,40 V112 M10,76 H82 M58,40 V112 M10,88 H82 M70,40 V112 M10,100 H82 M82,40 V112 M10,112 H82" class="s-line s-thin"/>
<rect x="10" y="40" width="36" height="36" class="f-line s-ink s-thick"/>
<path d="M118,52 V100 M118,52 H166 M130,52 V100 M118,64 H166 M142,52 V100 M118,76 H166 M154,52 V100 M118,88 H166 M166,52 V100 M118,100 H166" class="s-line s-thin"/>
<rect x="118" y="52" width="12" height="12" class="f-line s-ink s-thick"/>
<path d="M46,40 L118,52 M46,76 L118,64" class="s-muted s-thin s-dash"/>
<path d="M208,64 V88 M208,64 H232 M220,64 V88 M208,76 H232 M232,64 V88 M208,88 H232" class="s-line s-thin"/>
<line x1="170" y1="76" x2="202" y2="76" class="s-ink s-thin" marker-end="url(#convolutional-neural-network-arrow)"/>
<line x1="236" y1="76" x2="260" y2="76" class="s-ink s-thin" marker-end="url(#convolutional-neural-network-arrow)"/>
<rect x="264" y="62" width="48" height="28" rx="4" class="f-sheet s-ink"/>
<text x="288" y="80" text-anchor="middle">cat</text>
<text x="46" y="128" text-anchor="middle" class="t-small">image</text>
<text x="28" y="30" class="t-small">3×3 filter</text>
<text x="142" y="128" text-anchor="middle" class="t-small">feature map</text>
<text x="220" y="128" text-anchor="middle" class="t-small">pool</text>
<text x="288" y="128" text-anchor="middle" class="t-small">class</text>
<text x="160" y="156" text-anchor="middle" class="t-small t-muted">The same small filter slides over every position</text>
<text x="160" y="169" text-anchor="middle" class="t-small t-muted">and pooling shrinks the map</text>
