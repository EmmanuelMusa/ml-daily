<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 198" role="img">
<title>Model parallelism splits a model across GPUs, either by layers or inside each layer</title>
<defs><marker id="model-parallelism-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink s-none"/></marker></defs>
<text x="80" y="14" text-anchor="middle" class="t-small t-bold">pipeline parallel</text>
<text x="240" y="14" text-anchor="middle" class="t-small t-bold">tensor parallel</text>
<line x1="160" y1="8" x2="160" y2="172" class="s-line s-thin"/>
<rect x="10" y="22" width="140" height="62" rx="6" class="s-muted s-dash"/>
<text x="126" y="57" text-anchor="middle" class="t-small t-muted">GPU 0</text>
<rect x="18" y="29" width="82" height="22" rx="5" class="f-sheet s-muted"/>
<text x="59" y="44" text-anchor="middle" class="t-small">layer 1</text>
<rect x="18" y="55" width="82" height="22" rx="5" class="f-sheet s-muted"/>
<text x="59" y="70" text-anchor="middle" class="t-small">layer 2</text>
<rect x="10" y="98" width="140" height="62" rx="6" class="s-muted s-dash"/>
<text x="126" y="133" text-anchor="middle" class="t-small t-muted">GPU 1</text>
<rect x="18" y="105" width="82" height="22" rx="5" class="f-sheet s-muted"/>
<text x="59" y="120" text-anchor="middle" class="t-small">layer 3</text>
<rect x="18" y="131" width="82" height="22" rx="5" class="f-sheet s-muted"/>
<text x="59" y="146" text-anchor="middle" class="t-small">layer 4</text>
<path d="M59,84 L59,103" class="s-ink" marker-end="url(#model-parallelism-ink)"/>
<text x="80" y="174" text-anchor="middle" class="t-small t-muted">data flows GPU 0 to GPU 1</text>
<text x="240" y="32" text-anchor="middle" class="t-small">input x</text>
<path d="M232,36 L200,54" class="s-ink" marker-end="url(#model-parallelism-ink)"/>
<path d="M248,36 L280,54" class="s-ink" marker-end="url(#model-parallelism-ink)"/>
<rect x="170" y="56" width="62" height="54" rx="5" class="f-sheet s-muted"/>
<text x="201" y="81" text-anchor="middle" class="t-small">W left half</text>
<text x="201" y="93" text-anchor="middle" class="t-small">GPU 0</text>
<rect x="248" y="56" width="62" height="54" rx="5" class="f-sheet s-muted"/>
<text x="279" y="81" text-anchor="middle" class="t-small">W right half</text>
<text x="279" y="93" text-anchor="middle" class="t-small">GPU 1</text>
<path d="M201,110 L226,130" class="s-ink" marker-end="url(#model-parallelism-ink)"/>
<path d="M279,110 L254,130" class="s-ink" marker-end="url(#model-parallelism-ink)"/>
<rect x="196" y="132" width="88" height="24" rx="5" class="f-sheet s-ink"/>
<text x="240" y="148" text-anchor="middle" class="t-small">combine outputs</text>
<text x="240" y="174" text-anchor="middle" class="t-small t-muted">one layer split in two</text>
<text x="160" y="192" text-anchor="middle" class="t-small t-muted">Used when the model will not fit on one GPU.</text>
</svg>
