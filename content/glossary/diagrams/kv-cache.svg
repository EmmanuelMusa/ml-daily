<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 178" role="img">
<title>The KV cache keeps past keys and values so each new token computes only its own</title>
<text x="73" y="22" text-anchor="middle" class="t-small t-muted">t1</text>
<text x="119" y="22" text-anchor="middle" class="t-small t-muted">t2</text>
<text x="165" y="22" text-anchor="middle" class="t-small t-muted">t3</text>
<text x="211" y="22" text-anchor="middle" class="t-small t-muted">t4</text>
<text x="257" y="22" text-anchor="middle" class="t-small t-bold">t5</text>
<text x="30" y="48" text-anchor="middle" class="t-label">Q</text>
<rect x="236" y="30" width="42" height="26" rx="5" class="f-paper s-ink s-thick"/>
<text x="257" y="47" text-anchor="middle" class="t-small t-bold">q5</text>
<text x="30" y="78" text-anchor="middle" class="t-label">K</text>
<rect x="52" y="60" width="42" height="26" rx="5" class="f-sheet s-line"/>
<text x="73" y="77" text-anchor="middle" class="t-small">k1</text>
<rect x="98" y="60" width="42" height="26" rx="5" class="f-sheet s-line"/>
<text x="119" y="77" text-anchor="middle" class="t-small">k2</text>
<rect x="144" y="60" width="42" height="26" rx="5" class="f-sheet s-line"/>
<text x="165" y="77" text-anchor="middle" class="t-small">k3</text>
<rect x="190" y="60" width="42" height="26" rx="5" class="f-sheet s-line"/>
<text x="211" y="77" text-anchor="middle" class="t-small">k4</text>
<rect x="236" y="60" width="42" height="26" rx="5" class="f-paper s-ink s-thick"/>
<text x="257" y="77" text-anchor="middle" class="t-small t-bold">k5</text>
<text x="30" y="108" text-anchor="middle" class="t-label">V</text>
<rect x="52" y="90" width="42" height="26" rx="5" class="f-sheet s-line"/>
<text x="73" y="107" text-anchor="middle" class="t-small">v1</text>
<rect x="98" y="90" width="42" height="26" rx="5" class="f-sheet s-line"/>
<text x="119" y="107" text-anchor="middle" class="t-small">v2</text>
<rect x="144" y="90" width="42" height="26" rx="5" class="f-sheet s-line"/>
<text x="165" y="107" text-anchor="middle" class="t-small">v3</text>
<rect x="190" y="90" width="42" height="26" rx="5" class="f-sheet s-line"/>
<text x="211" y="107" text-anchor="middle" class="t-small">v4</text>
<rect x="236" y="90" width="42" height="26" rx="5" class="f-paper s-ink s-thick"/>
<text x="257" y="107" text-anchor="middle" class="t-small t-bold">v5</text>
<text x="140" y="47" text-anchor="middle" class="t-small t-muted">old queries not needed again</text>
<rect x="12" y="132" width="14" height="12" rx="3" class="f-sheet s-line"/>
<text x="32" y="142" class="t-small">cached, reused</text>
<rect x="150" y="132" width="14" height="12" rx="3" class="f-paper s-ink s-thick"/>
<text x="170" y="142" class="t-small">computed this step</text>
<text x="160" y="168" text-anchor="middle" class="t-small t-muted">q5 attends over k1 to k5 without redoing t1 to t4.</text>
</svg>
