<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 246" role="img">
<title>Pre-norm transformer block: norm then attention with a residual add, then norm then feed-forward with a residual add</title>
<defs><marker id="transformer-block-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="f-ink s-none"/></marker></defs>
<text x="8" y="14" class="t-small t-muted">stacked N times</text>
<text x="160" y="240" text-anchor="middle" class="t-small">token vectors in</text>
<line x1="160" y1="230" x2="160" y2="208" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<rect x="92" y="188" width="136" height="18" rx="4" class="s-line"/>
<text x="160" y="201" text-anchor="middle" class="t-small">Norm</text>
<line x1="160" y1="188" x2="160" y2="178" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<rect x="92" y="152" width="136" height="24" rx="4" class="f-sheet s-ink"/>
<text x="160" y="168" text-anchor="middle">Self-attention</text>
<line x1="160" y1="152" x2="160" y2="142" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<circle cx="160" cy="133" r="7" class="s-ink"/>
<path d="M155,133 H165 M160,128 V138" class="s-ink s-thin"/>
<line x1="160" y1="126" x2="160" y2="116" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<rect x="92" y="96" width="136" height="18" rx="4" class="s-line"/>
<text x="160" y="109" text-anchor="middle" class="t-small">Norm</text>
<line x1="160" y1="96" x2="160" y2="86" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<rect x="92" y="60" width="136" height="24" rx="4" class="f-sheet s-ink"/>
<text x="160" y="76" text-anchor="middle">Feed-forward</text>
<line x1="160" y1="60" x2="160" y2="50" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<circle cx="160" cy="41" r="7" class="s-ink"/>
<path d="M155,41 H165 M160,36 V46" class="s-ink s-thin"/>
<line x1="160" y1="34" x2="160" y2="20" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<text x="196" y="22" class="t-small">vectors out</text>
<path d="M160,220 H252 V133 H169" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<path d="M160,121 H252 V41 H169" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<text x="258" y="180" class="t-small t-muted">residual</text>
<text x="258" y="88" class="t-small t-muted">residual</text>
<text x="86" y="162" text-anchor="end" class="t-small">tokens share</text>
<text x="86" y="175" text-anchor="end" class="t-small">information</text>
<text x="86" y="70" text-anchor="end" class="t-small">each token</text>
<text x="86" y="83" text-anchor="end" class="t-small">on its own</text>
<text x="86" y="137" text-anchor="end" class="t-small t-muted">add</text>
<text x="86" y="45" text-anchor="end" class="t-small t-muted">add</text>
</svg>
