<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 222" role="img">
<title>Transformer block: attention then feed-forward, each with a residual and norm</title>
<defs><marker id="transformer-block-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="f-ink s-none"/></marker></defs>
<text x="160" y="214" text-anchor="middle" class="t-small">token vectors in</text>
<line x1="160" y1="202" x2="160" y2="180" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<rect x="92" y="150" width="136" height="28" rx="4" class="f-sheet s-ink"/>
<text x="160" y="168" text-anchor="middle">Self-attention</text>
<line x1="160" y1="150" x2="160" y2="140" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<rect x="92" y="118" width="136" height="20" rx="4" class="s-line"/>
<text x="160" y="132" text-anchor="middle">Add &amp; norm</text>
<line x1="160" y1="118" x2="160" y2="108" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<rect x="92" y="78" width="136" height="28" rx="4" class="f-sheet s-ink"/>
<text x="160" y="96" text-anchor="middle">Feed-forward</text>
<line x1="160" y1="78" x2="160" y2="68" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<rect x="92" y="46" width="136" height="20" rx="4" class="s-line"/>
<text x="160" y="60" text-anchor="middle">Add &amp; norm</text>
<line x1="160" y1="46" x2="160" y2="28" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<text x="160" y="20" text-anchor="middle" class="t-small">vectors out</text>
<path d="M160,192 H252 V128 H232" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<path d="M160,113 H252 V56 H232" class="s-ink s-thin" marker-end="url(#transformer-block-arrow)"/>
<text x="258" y="164" class="t-small t-muted">residual</text>
<text x="258" y="88" class="t-small t-muted">residual</text>
<text x="86" y="160" text-anchor="end" class="t-small">tokens share</text>
<text x="86" y="173" text-anchor="end" class="t-small">information</text>
<text x="86" y="88" text-anchor="end" class="t-small">each token</text>
<text x="86" y="101" text-anchor="end" class="t-small">on its own</text>
<text x="8" y="20" class="t-small t-muted">stacked N times</text>
</svg>
