<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 172" role="img">
<title>Residual connection: the input skips the layer and is added to its output</title>
<defs><marker id="residual-connection-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="f-ink s-none"/></marker></defs>
<text x="14" y="104" class="t-label">x</text>
<line x1="28" y1="100" x2="98" y2="100" class="s-ink" marker-end="url(#residual-connection-arrow)"/>
<rect x="100" y="80" width="100" height="40" rx="4" class="f-sheet s-ink"/>
<text x="150" y="98" text-anchor="middle">Layer F</text>
<text x="150" y="112" text-anchor="middle" class="t-small t-muted">learns a change</text>
<line x1="200" y1="100" x2="232" y2="100" class="s-ink" marker-end="url(#residual-connection-arrow)"/>
<circle cx="244" cy="100" r="11" class="s-ink"/>
<path d="M238,100 H250 M244,94 V106" class="s-ink"/>
<line x1="255" y1="100" x2="270" y2="100" class="s-ink" marker-end="url(#residual-connection-arrow)"/>
<text x="274" y="104" class="t-small t-bold">F(x) + x</text>
<path d="M60,100 V42 H244 V86" class="s-ink s-thick" marker-end="url(#residual-connection-arrow)"/>
<text x="150" y="34" text-anchor="middle" class="t-small">skip path: x passes unchanged</text>
<text x="160" y="150" text-anchor="middle" class="t-small t-muted">The layer only has to learn the difference,</text>
<text x="160" y="163" text-anchor="middle" class="t-small t-muted">and gradients flow back through the skip</text>
</svg>
