<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" role="img">
<title>RAG retrieves relevant chunks and puts them in the prompt before the LLM answers</title>
<defs><marker id="retrieval-augmented-generation-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink s-none"/></marker></defs>
<rect x="6" y="14" width="74" height="32" rx="5" class="f-sheet s-ink"/>
<text x="43" y="34" text-anchor="middle" class="t-small t-bold">question</text>
<path d="M80,30 L106,30" class="s-ink" marker-end="url(#retrieval-augmented-generation-ink)"/>
<rect x="108" y="14" width="80" height="32" rx="5" class="f-sheet s-muted"/>
<text x="148" y="28" text-anchor="middle" class="t-small">retriever</text>
<text x="148" y="40" text-anchor="middle" class="t-small">embeds query</text>
<path d="M188,30 L220,30" class="s-ink" marker-end="url(#retrieval-augmented-generation-ink)" marker-start="url(#retrieval-augmented-generation-ink)"/>
<rect x="222" y="14" width="92" height="32" rx="5" class="f-sheet s-muted"/>
<text x="268" y="28" text-anchor="middle" class="t-small">document</text>
<text x="268" y="40" text-anchor="middle" class="t-small">index</text>
<path d="M268,46 L268,76" class="s-ink" marker-end="url(#retrieval-augmented-generation-ink)"/>
<rect x="222" y="78" width="92" height="32" rx="5" class="f-sheet s-muted"/>
<text x="268" y="98" text-anchor="middle" class="t-small">top-k chunks</text>
<path d="M222,94 L202,94" class="s-ink" marker-end="url(#retrieval-augmented-generation-ink)"/>
<rect x="96" y="78" width="104" height="32" rx="5" class="f-sheet s-ink"/>
<text x="148" y="92" text-anchor="middle" class="t-small">LLM</text>
<text x="148" y="104" text-anchor="middle" class="t-small">prompt = Q + chunks</text>
<path d="M30,46 L30,94 L94,94" class="s-ink" marker-end="url(#retrieval-augmented-generation-ink)"/>
<text x="36" y="66" class="t-small t-muted">question</text>
<text x="36" y="78" class="t-small t-muted">goes in too</text>
<path d="M148,110 L148,136" class="s-ink" marker-end="url(#retrieval-augmented-generation-ink)"/>
<rect x="98" y="138" width="100" height="32" rx="5" class="f-right s-right"/>
<text x="148" y="152" text-anchor="middle" class="t-small">answer</text>
<text x="148" y="164" text-anchor="middle" class="t-small">grounded in sources</text>
</svg>
