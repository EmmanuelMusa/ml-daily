<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
<title>A two-stage recommender narrows millions of items with cheap retrieval, then ranks a few hundred carefully</title>
<defs><marker id="two-stage-recommender-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink s-none"/></marker></defs>
<polygon points="8,10 152,50 152,120 8,160" class="f-sheet s-muted"/>
<polygon points="162,50 290,76 290,94 162,120" class="f-sheet s-ink"/>
<text x="70" y="74" text-anchor="middle" class="t-label">retrieval</text>
<text x="70" y="92" text-anchor="middle" class="t-small t-muted">cheap, fast</text>
<text x="70" y="108" text-anchor="middle" class="t-small">10M to 500</text>
<text x="214" y="82" text-anchor="middle" class="t-label">ranking</text>
<text x="214" y="98" text-anchor="middle" class="t-small t-muted">heavy model</text>
<path d="M292,85 L312,85" class="s-ink" marker-end="url(#two-stage-recommender-ink)"/>
<text x="300" y="112" text-anchor="middle" class="t-small t-bold">top 10</text>
<text x="300" y="124" text-anchor="middle" class="t-small t-muted">shown</text>
<text x="160" y="176" text-anchor="middle" class="t-small t-muted">Cheap model on everything, costly model on few.</text>
</svg>
