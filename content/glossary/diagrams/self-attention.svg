<text x="250" y="38" text-anchor="middle" class="t-muted">was</text>
<text x="295" y="38" text-anchor="middle" class="t-muted">tired</text>
<rect x="190" y="24" width="30" height="20" rx="4" class="s-ink"/>
<line x1="205" y1="46" x2="25" y2="116" class="s-muted s-thin s-dash"/>
<text x="25" y="132" text-anchor="middle">the</text>
<text x="25" y="148" text-anchor="middle" class="t-small t-muted">.04</text>
<line x1="205" y1="46" x2="70" y2="116" class="s-ink s-thick"/>
<text x="70" y="132" text-anchor="middle">cat</text>
