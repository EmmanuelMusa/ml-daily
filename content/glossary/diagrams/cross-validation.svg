<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 192" role="img">
<title>5-fold cross-validation: each fold is held out once</title>
<defs><marker id="cross-validation-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="f-ink s-none"/></marker></defs>
<text x="10" y="27" class="t-small">Fold 1</text>
<rect x="52" y="14" width="36" height="18" class="f-muted s-ink s-thin"/>
<rect x="88" y="14" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="124" y="14" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="160" y="14" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="196" y="14" width="36" height="18" class="f-sheet s-line s-thin"/>
<line x1="236" y1="23" x2="256" y2="23" class="s-ink s-thin" marker-end="url(#cross-validation-arrow)"/>
<text x="262" y="27" class="t-small">score 1</text>
<text x="10" y="53" class="t-small">Fold 2</text>
<rect x="52" y="40" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="88" y="40" width="36" height="18" class="f-muted s-ink s-thin"/>
<rect x="124" y="40" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="160" y="40" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="196" y="40" width="36" height="18" class="f-sheet s-line s-thin"/>
<line x1="236" y1="49" x2="256" y2="49" class="s-ink s-thin" marker-end="url(#cross-validation-arrow)"/>
<text x="262" y="53" class="t-small">score 2</text>
<text x="10" y="79" class="t-small">Fold 3</text>
<rect x="52" y="66" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="88" y="66" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="124" y="66" width="36" height="18" class="f-muted s-ink s-thin"/>
<rect x="160" y="66" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="196" y="66" width="36" height="18" class="f-sheet s-line s-thin"/>
<line x1="236" y1="75" x2="256" y2="75" class="s-ink s-thin" marker-end="url(#cross-validation-arrow)"/>
<text x="262" y="79" class="t-small">score 3</text>
<text x="10" y="105" class="t-small">Fold 4</text>
<rect x="52" y="92" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="88" y="92" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="124" y="92" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="160" y="92" width="36" height="18" class="f-muted s-ink s-thin"/>
<rect x="196" y="92" width="36" height="18" class="f-sheet s-line s-thin"/>
<line x1="236" y1="101" x2="256" y2="101" class="s-ink s-thin" marker-end="url(#cross-validation-arrow)"/>
<text x="262" y="105" class="t-small">score 4</text>
<text x="10" y="131" class="t-small">Fold 5</text>
<rect x="52" y="118" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="88" y="118" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="124" y="118" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="160" y="118" width="36" height="18" class="f-sheet s-line s-thin"/>
<rect x="196" y="118" width="36" height="18" class="f-muted s-ink s-thin"/>
<line x1="236" y1="127" x2="256" y2="127" class="s-ink s-thin" marker-end="url(#cross-validation-arrow)"/>
<text x="262" y="131" class="t-small">score 5</text>
<rect x="52" y="152" width="14" height="10" class="f-muted s-ink s-thin"/>
<text x="71" y="161" class="t-small">validation</text>
<rect x="136" y="152" width="14" height="10" class="f-sheet s-line s-thin"/>
<text x="155" y="161" class="t-small">training</text>
<text x="160" y="184" text-anchor="middle" class="t-small">Final estimate = average of the 5 scores</text>
</svg>
