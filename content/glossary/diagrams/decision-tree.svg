<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 184" role="img">
<title>A decision tree routes a case through yes or no questions to a leaf</title>
<defs><marker id="decision-tree-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="f-ink s-none"/></marker></defs>
<rect x="68" y="14" width="124" height="28" rx="4" class="s-ink"/>
<text x="130" y="32" text-anchor="middle">Income &gt; 50k?</text>
<rect x="15" y="82" width="80" height="26" rx="4" class="f-sheet s-line"/>
<text x="55" y="99" text-anchor="middle">Decline</text>
<rect x="148" y="81" width="124" height="28" rx="4" class="s-ink"/>
<text x="210" y="99" text-anchor="middle">Debt &lt; 40%?</text>
<rect x="120" y="149" width="80" height="26" rx="4" class="f-sheet s-line"/>
<text x="160" y="166" text-anchor="middle">Approve</text>
<rect x="230" y="149" width="80" height="26" rx="4" class="f-sheet s-line"/>
<text x="270" y="166" text-anchor="middle">Decline</text>
<line x1="110" y1="42" x2="68" y2="81" class="s-ink s-thin" marker-end="url(#decision-tree-arrow)"/>
<text x="78" y="58" text-anchor="end" class="t-small t-muted">no</text>
<line x1="150" y1="42" x2="194" y2="80" class="s-ink s-thin" marker-end="url(#decision-tree-arrow)"/>
<text x="180" y="58" class="t-small t-muted">yes</text>
<line x1="196" y1="109" x2="170" y2="148" class="s-ink s-thin" marker-end="url(#decision-tree-arrow)"/>
<text x="176" y="128" text-anchor="end" class="t-small t-muted">yes</text>
<line x1="226" y1="109" x2="258" y2="148" class="s-ink s-thin" marker-end="url(#decision-tree-arrow)"/>
<text x="248" y="128" class="t-small t-muted">no</text>
<text x="10" y="140" class="t-small t-muted">Each split asks</text>
<text x="10" y="153" class="t-small t-muted">one feature</text>
<text x="10" y="166" class="t-small t-muted">question</text>
</svg>
