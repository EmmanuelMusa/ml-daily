<circle cx="142" cy="66" r="3.5" class="f-muted s-none"/>
<circle cx="122" cy="50" r="3.5" class="f-muted s-none"/>
<path d="M134,42 L146,54 M146,42 L134,54" class="s-ink s-thick"/>
<circle cx="92" cy="130" r="30" class="s-line s-dash"/>
<circle cx="76" cy="120" r="3.5" class="f-muted s-none"/>
<circle cx="104" cy="118" r="3.5" class="f-muted s-none"/>
<circle cx="88" cy="146" r="3.5" class="f-muted s-none"/>
<circle cx="110" cy="140" r="3.5" class="f-muted s-none"/>
