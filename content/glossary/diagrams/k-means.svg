<circle cx="140" cy="48" r="30" class="s-line s-dash"/>
<circle cx="128" cy="36" r="3.5" class="f-muted s-none"/>
<circle cx="150" cy="34" r="3.5" class="f-muted s-none"/>
<circle cx="156" cy="56" r="3.5" class="f-muted s-none"/>
