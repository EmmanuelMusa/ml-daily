<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" role="img">
<title>k-means groups points around 3 centroids</title>
<defs><marker id="k-means-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="f-ink s-none"/></marker></defs>
<rect x="6" y="8" width="180" height="164" rx="4" class="s-line s-thin"/>
<circle cx="50" cy="50" r="30" class="s-line s-dash"/>
<circle cx="36" cy="40" r="3.5" class="f-muted s-none"/>
<circle cx="58" cy="36" r="3.5" class="f-muted s-none"/>
<circle cx="44" cy="62" r="3.5" class="f-muted s-none"/>
<circle cx="64" cy="58" r="3.5" class="f-muted s-none"/>
<circle cx="30" cy="56" r="3.5" class="f-muted s-none"/>
