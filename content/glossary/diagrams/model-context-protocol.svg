<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 186" role="img">
<title>MCP lets a host app connect its LLM to many tool servers through one standard protocol</title>
<defs><marker id="model-context-protocol-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink s-none"/></marker><marker id="model-context-protocol-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-muted s-none"/></marker></defs>
<rect x="4" y="8" width="132" height="150" rx="8" class="s-muted s-dash"/>
<text x="70" y="24" text-anchor="middle" class="t-small t-bold">host app</text>
<rect x="12" y="36" width="44" height="112" rx="5" class="f-sheet s-ink"/>
<text x="34" y="96" text-anchor="middle" class="t-label">LLM</text>
<path d="M56,52 L72,52" class="s-muted s-thin" marker-end="url(#model-context-protocol-muted)"/>
<rect x="74" y="40" width="54" height="24" rx="5" class="f-sheet s-muted"/>
<text x="101" y="56" text-anchor="middle" class="t-small">client</text>
<path d="M130,52 L198,52" class="s-ink" marker-end="url(#model-context-protocol-ink)" marker-start="url(#model-context-protocol-ink)"/>
<rect x="200" y="36" width="112" height="32" rx="5" class="f-sheet s-muted"/>
<text x="256" y="50" text-anchor="middle" class="t-small">server:</text>
<text x="256" y="62" text-anchor="middle" class="t-small">files</text>
<path d="M56,92 L72,92" class="s-muted s-thin" marker-end="url(#model-context-protocol-muted)"/>
<rect x="74" y="80" width="54" height="24" rx="5" class="f-sheet s-muted"/>
<text x="101" y="96" text-anchor="middle" class="t-small">client</text>
<path d="M130,92 L198,92" class="s-ink" marker-end="url(#model-context-protocol-ink)" marker-start="url(#model-context-protocol-ink)"/>
<rect x="200" y="76" width="112" height="32" rx="5" class="f-sheet s-muted"/>
<text x="256" y="90" text-anchor="middle" class="t-small">server:</text>
<text x="256" y="102" text-anchor="middle" class="t-small">database</text>
<path d="M56,132 L72,132" class="s-muted s-thin" marker-end="url(#model-context-protocol-muted)"/>
<rect x="74" y="120" width="54" height="24" rx="5" class="f-sheet s-muted"/>
<text x="101" y="136" text-anchor="middle" class="t-small">client</text>
<path d="M130,132 L198,132" class="s-ink" marker-end="url(#model-context-protocol-ink)" marker-start="url(#model-context-protocol-ink)"/>
<rect x="200" y="116" width="112" height="32" rx="5" class="f-sheet s-muted"/>
<text x="256" y="130" text-anchor="middle" class="t-small">server:</text>
<text x="256" y="142" text-anchor="middle" class="t-small">tickets</text>
<text x="164" y="46" text-anchor="middle" class="t-small t-bold">MCP</text>
<text x="160" y="178" text-anchor="middle" class="t-small t-muted">Servers expose tools, resources and prompts.</text>
</svg>
