<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" role="img">
<title>A feature store serves the same features offline for training and online for serving</title>
<defs><marker id="feature-store-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink s-none"/></marker></defs>
<rect x="4" y="76" width="56" height="36" rx="5" class="f-sheet s-muted"/>
<text x="32" y="92" text-anchor="middle" class="t-small">raw</text>
<text x="32" y="104" text-anchor="middle" class="t-small">data</text>
<path d="M60,94 L74,94" class="s-ink" marker-end="url(#feature-store-ink)"/>
<rect x="76" y="76" width="62" height="36" rx="5" class="f-sheet s-muted"/>
<text x="107" y="92" text-anchor="middle" class="t-small">feature</text>
<text x="107" y="104" text-anchor="middle" class="t-small">pipelines</text>
<rect x="154" y="10" width="86" height="160" rx="8" class="s-ink s-dash"/>
<text x="197" y="26" text-anchor="middle" class="t-small t-bold">feature store</text>
<rect x="162" y="36" width="70" height="52" rx="5" class="f-sheet s-muted"/>
<text x="197" y="60" text-anchor="middle" class="t-small">offline</text>
<text x="197" y="72" text-anchor="middle" class="t-small">full history</text>
<rect x="162" y="104" width="70" height="52" rx="5" class="f-sheet s-muted"/>
<text x="197" y="128" text-anchor="middle" class="t-small">online</text>
<text x="197" y="140" text-anchor="middle" class="t-small">latest values</text>
<path d="M138,90 L160,66" class="s-ink" marker-end="url(#feature-store-ink)"/>
<path d="M138,98 L160,126" class="s-ink" marker-end="url(#feature-store-ink)"/>
<path d="M232,62 L254,62" class="s-ink" marker-end="url(#feature-store-ink)"/>
<path d="M232,130 L254,130" class="s-ink" marker-end="url(#feature-store-ink)"/>
<rect x="256" y="44" width="60" height="36" rx="5" class="f-sheet s-ink"/>
<text x="286" y="60" text-anchor="middle" class="t-small">training</text>
<text x="286" y="72" text-anchor="middle" class="t-small">batch</text>
<rect x="256" y="112" width="60" height="36" rx="5" class="f-sheet s-ink"/>
<text x="286" y="128" text-anchor="middle" class="t-small">serving</text>
<text x="286" y="140" text-anchor="middle" class="t-small">low latency</text>
<text x="160" y="186" text-anchor="middle" class="t-small t-muted">One definition per feature, so training matches serving.</text>
</svg>
