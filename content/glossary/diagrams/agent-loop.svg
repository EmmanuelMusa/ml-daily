<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 172" role="img">
<title>An agent loops: the LLM decides, calls a tool, observes the result, and repeats until done</title>
<defs><marker id="agent-loop-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-ink s-none"/></marker></defs>
<rect x="4" y="18" width="58" height="30" rx="5" class="f-sheet s-muted"/>
<text x="33" y="37" text-anchor="middle" class="t-small">task</text>
<path d="M62,33 L118,33" class="s-ink" marker-end="url(#agent-loop-ink)"/>
<rect x="120" y="18" width="80" height="30" rx="5" class="f-sheet s-ink"/>
<text x="160" y="37" text-anchor="middle" class="t-small t-bold">LLM decides</text>
<path d="M200,33 L256,33" class="s-ink" marker-end="url(#agent-loop-ink)"/>
<text x="228" y="27" text-anchor="middle" class="t-small t-muted">done</text>
<rect x="258" y="18" width="58" height="30" rx="5" class="f-right s-right"/>
<text x="287" y="37" text-anchor="middle" class="t-small">answer</text>
<path d="M180,48 L236,108" class="s-ink" marker-end="url(#agent-loop-ink)"/>
<rect x="200" y="110" width="112" height="30" rx="5" class="f-sheet s-muted"/>
<text x="256" y="123" text-anchor="middle" class="t-small">call a tool</text>
<text x="256" y="135" text-anchor="middle" class="t-small">(search, code, API)</text>
<path d="M200,125 L124,125" class="s-ink" marker-end="url(#agent-loop-ink)"/>
<rect x="8" y="110" width="114" height="30" rx="5" class="f-sheet s-muted"/>
<text x="65" y="129" text-anchor="middle" class="t-small">observe the result</text>
<path d="M80,110 L140,50" class="s-ink" marker-end="url(#agent-loop-ink)"/>
<text x="160" y="86" text-anchor="middle" class="t-small t-bold">repeat</text>
<text x="160" y="162" text-anchor="middle" class="t-small t-muted">Each pass adds the tool result to the context.</text>
</svg>
