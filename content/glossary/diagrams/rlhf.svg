<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 164" role="img">
<title>RLHF in three stages: supervised fine-tuning, reward model, RL</title>
<defs><marker id="rlhf-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="f-ink s-none"/></marker></defs>
<rect x="6" y="14" width="94" height="96" rx="4" class="f-sheet s-ink"/>
<text x="53" y="34" text-anchor="middle" class="t-label">1. SFT</text>
<text x="53" y="54" text-anchor="middle" class="t-small">train on human</text>
<text x="53" y="67" text-anchor="middle" class="t-small">demo answers</text>
<line x1="102" y1="62" x2="110" y2="62" class="s-ink" marker-end="url(#rlhf-arrow)"/>
<rect x="112" y="14" width="94" height="96" rx="4" class="f-sheet s-ink"/>
<text x="159" y="34" text-anchor="middle" class="t-label">2. Reward</text>
<text x="159" y="54" text-anchor="middle" class="t-small">humans rank</text>
<text x="159" y="67" text-anchor="middle" class="t-small">answers A &gt; B</text>
<text x="159" y="80" text-anchor="middle" class="t-small">model learns</text>
<text x="159" y="93" text-anchor="middle" class="t-small">to score them</text>
<line x1="208" y1="62" x2="216" y2="62" class="s-ink" marker-end="url(#rlhf-arrow)"/>
<rect x="218" y="14" width="94" height="96" rx="4" class="f-sheet s-ink"/>
<text x="265" y="34" text-anchor="middle" class="t-label">3. RL tune</text>
<text x="265" y="54" text-anchor="middle" class="t-small">model answers,</text>
<text x="265" y="67" text-anchor="middle" class="t-small">reward model</text>
<text x="265" y="80" text-anchor="middle" class="t-small">scores, policy</text>
<text x="265" y="93" text-anchor="middle" class="t-small">is updated</text>
<path d="M265,110 V128 H59 V112" class="s-ink s-thin s-dash" marker-end="url(#rlhf-arrow)"/>
<text x="162" y="143" text-anchor="middle" class="t-small">KL penalty keeps the tuned model</text>
<text x="162" y="156" text-anchor="middle" class="t-small">close to the SFT model</text>
</svg>
